name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  quality-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-runtime.txt
          pip install -r requirements-dev.txt
          pip install build

      - name: Ruff
        run: ruff check apps src tests pages scripts monitoring app.py api.py main.py predict_customer.py save_processed_data.py

      - name: Black check
        run: black --check apps src tests pages scripts monitoring app.py api.py main.py predict_customer.py save_processed_data.py

      - name: Isort check
        run: isort --check-only apps src tests pages scripts monitoring app.py api.py main.py predict_customer.py save_processed_data.py

      - name: Mypy
        run: mypy src

      - name: Run tests
        run: pytest -q

      - name: Build package
        run: python -m build
