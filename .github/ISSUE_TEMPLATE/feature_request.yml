name: Feature request
description: Propose a repository, platform, or product improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What pain point or opportunity motivated this proposal?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should be built, changed, or removed?
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Expected impact
      description: What is the expected technical, operational, or portfolio payoff?
    validations:
      required: true
  - type: dropdown
    id: affected_area
    attributes:
      label: Primary area
      options:
        - repository structure
        - data pipeline
        - modeling
        - reporting
        - dashboard/api
        - observability
        - automation
        - documentation
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - high
        - medium
        - low
    validations:
      required: true
