name: Bug report
description: Report a functional defect, regression, or operational failure.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the observed issue.
      placeholder: The pipeline fails while persisting execution metadata after model training...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include commands, inputs, environment, and relevant files.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs and evidence
      description: Paste stack traces, structured logs, screenshots, run_id, or artifact paths.
  - type: dropdown
    id: affected_area
    attributes:
      label: Affected area
      options:
        - pipeline
        - modeling
        - reporting
        - dashboard
        - api
        - runtime/configuration
        - ci/cd
    validations:
      required: true
  - type: input
    id: run_id
    attributes:
      label: Run ID
      description: If applicable, include the pipeline run identifier.
