name: Data quality incident
description: Report a schema, consistency, or data quality problem.
title: "[Data Quality] "
labels: ["data-quality"]
body:
  - type: textarea
    id: symptom
    attributes:
      label: Symptom
      description: Describe the anomaly that was observed.
      placeholder: invalid churn labels, duplicated customerID, null spike, broken contract field...
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Affected layer
      options:
        - raw
        - bronze
        - silver
        - gold
        - reporting
        - dashboard/api consumption
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include sample rows, artifact paths, queries, report names, or run_id.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Describe the effect on pipeline behavior, model outputs, or business-facing artifacts.
    validations:
      required: true
  - type: input
    id: run_id
    attributes:
      label: Run ID
      description: If applicable, include the affected execution identifier.
