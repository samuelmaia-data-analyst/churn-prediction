name: churn-prediction-enterprise
prefect-version: 3

build: []
push: []
pull: []

deployments:
  - name: optional-daily-pipeline-run
    version: "1.0.0"
    description: "Optional Prefect deployment for scheduled execution of the canonical churn pipeline."
    tags:
      - optional
      - batch
      - daily
    entrypoint: src/cli/pipeline.py:run_pipeline
    parameters:
      seed: 42
      data_dir: data
      log_level: INFO
      mlflow_tracking_uri: file:./mlruns
      decision_policy: balanceada
      environment: prod
    schedules:
      - cron: "0 7 * * *"
        timezone: UTC
        active: true
    work_pool:
      name: default-agent-pool
      work_queue_name: default
